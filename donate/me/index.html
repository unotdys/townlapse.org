<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My donations · Gift a Cycle for Townlapse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%231C2629%22/><rect x=%2218%22 y=%2260%22 width=%2214%22 height=%2222%22 fill=%22%23EBC55A%22/><rect x=%2243%22 y=%2240%22 width=%2214%22 height=%2242%22 fill=%22%23E58C8C%22/><rect x=%2268%22 y=%2224%22 width=%2214%22 height=%2258%22 fill=%22%239DB8E0%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#F3EEE3;--dim:#B9B3A6;--bg:#1C2629;--panel:#243135;--line:#3A4A4F;--yellow:#EBC55A;--pink:#E58C8C;--green:#8FD1A8;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 17px/1.55 var(--body);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit;text-underline-offset:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 22px 80px}
header{padding:40px 0 10px;display:flex;justify-content:space-between}
.home{font:800 22px var(--display);text-decoration:none}
h1{font:800 clamp(40px,7vw,64px)/.92 var(--display);margin:22px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 24px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats b{display:block;font:800 40px/1 var(--display);color:var(--yellow)}
.stats span{color:var(--dim);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600}
.s-accepted{color:var(--green)} .s-rejected{color:var(--pink)} .s-new{color:var(--yellow)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0}
.panel h2{font:800 24px var(--display);margin:0 0 10px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel label{display:block;font-weight:600;margin:10px 0 4px;font-size:15px}
.panel select,.panel input.f{width:100%;max-width:360px;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ok{color:var(--green)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin:4px 0 14px}
.tab{background:transparent;color:var(--dim);border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:9px 14px;font:600 15px var(--body);cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:-1px}
.tab.on{color:var(--ink);background:var(--bg);border-color:var(--line)}
.tab.add{color:var(--yellow)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.tab .dot.ok{background:var(--green)}
details summary{cursor:pointer;font-weight:600}
.key{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px dashed var(--yellow);border-radius:8px;padding:9px 11px;word-break:break-all;margin:6px 0}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
input{width:100%;font:15px ui-monospace,monospace;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
button{font:600 15px var(--body);color:var(--bg);background:var(--yellow);border:0;border-radius:999px;padding:11px 18px;cursor:pointer;margin-top:10px}
.hint{font-size:14px;color:var(--dim)} .err{color:var(--pink)}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.gac{margin:-6px 0 14px;font-size:15px;color:var(--dim)}.gac a{color:var(--ink);font-weight:600;text-decoration:none}.gac a:hover{text-decoration:underline}.gac span a{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="home" href="/">Townlapse</a><a class="hint" href="#change">Change my donation</a></header>
  <h1 id="title">My donations</h1>
  <p class="gac"><a href="https://giftacycle.org">🎁 Gift a Cycle</a> <span>powered by <a href="https://nobgp.com">noBGP</a></span></p>
  <div id="ask" hidden>
    <p>Enter your donor key (it starts with <code>tld_</code>):</p>
    <input id="key" autocomplete="off" aria-label="Donor key"><button id="load">Show my donations</button> <span class="hint err" id="err"></span>
  </div>
  <div id="out"></div>
</div>
<script>
const API = "https://api.townlapse.org/api/tl";
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let key = ""; try { key = localStorage.getItem("townlapse_donor_key") || ""; } catch {}
async function load() {
  $("err").textContent = "";
  try {
    const r = await fetch(`${API}/d/me`, { headers: { "x-donor-key": key } }); const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Couldn't load.");
    try { localStorage.setItem("townlapse_donor_key", key); } catch {}
    $("ask").hidden = true;
    const b = d.budget, st = d.by_status || {};
    $("title").textContent = `Thank you, ${d.donor}`;
    $("out").innerHTML = `<p class="hint">${esc(d.ai)} · ${d.mode === "subscription" ? "on a schedule" : "once, when you ask"} · ${b.budget_per_day} a day${b.window ? `, ${esc(b.window)}` : ""} · ${b.scope === "town" ? "town: " + esc(b.town) : b.scope === "any" ? "any town" : "where it's needed most"}</p>
      <div class="stats"><div><b>${b.remaining_today}</b><span>left today (of ${b.budget_today || b.budget_per_day})</span></div>
        <div><b>${d.assignments_completed}</b><span>assignments done</span></div>
        <div><b>${d.submissions}</b><span>places submitted</span></div>
        <div><b>${st.accepted || 0}</b><span>accepted on the map</span></div></div>
      <div class="panel"><h2>Your AIs</h2>
        <div class="tabs" role="tablist" aria-label="Your AIs" id="aiTabs"></div>
        <div id="aiPane" role="tabpanel"></div></div>
      <div class="panel"><h2>Get more assignments today</h2>
        <p class="hint" style="margin:0 0 10px">Your AI can keep going with the same key. ${b.extra_today ? `Already added today: +${b.extra_today}.` : ""}</p>
        <div class="row"><button data-add="10">+10 today</button><button data-add="25" class="ghost">+25 today</button><span class="hint" id="addMsg" aria-live="polite"></span></div>
        <p class="hint" style="margin:10px 0 0">Then paste the same prompt into your AI again; it picks up where it left off.</p></div>
      <div class="panel" id="change"><h2>Change my donation</h2>
        <label for="cBudget">Assignments per day</label><input class="f" id="cBudget" type="number" min="1" max="100" value="${b.budget_per_day}">
        <label for="cMode">How</label><select id="cMode"><option value="adhoc"${d.mode === "adhoc" ? " selected" : ""}>Once, when I ask my AI</option><option value="subscription"${d.mode === "subscription" ? " selected" : ""}>On a schedule</option></select>
        ${d.sponsor_of ? `<p class="hint">You're the sponsor of ${esc(d.sponsor_of)}; your key always works for your town.</p>` :
          `<label for="cScope">Where</label><select id="cScope"><option value="neediest"${b.scope === "neediest" ? " selected" : ""}>Where it's needed most</option><option value="any"${b.scope === "any" ? " selected" : ""}>Any town</option><option value="town"${b.scope === "town" ? " selected" : ""}>One town…</option></select>
           <select id="cTown" style="margin-top:6px" ${b.scope === "town" ? "" : "hidden"}></select>`}
        <div class="row" style="margin-top:12px"><button id="cSave">Save changes</button><span class="hint" id="cMsg" aria-live="polite"></span></div>
        <p class="hint" style="margin:12px 0 0">Want a separate donation with its own key? <a href="/donate/">Set up a new one</a>.</p></div>
      <h2 style="font:800 26px var(--display)">Recent submissions</h2>
      ${(d.recent || []).length ? `<table><thead><tr><th>Place</th><th>Town</th><th>Verdict</th></tr></thead><tbody>${d.recent.slice().reverse().map(x => `<tr><td><b>${esc(x.name)}</b><br><span class="hint">${esc(x.address)}</span></td><td>${esc(x.town || "")}</td><td class="s-${esc(x.status)}">${esc(x.status === "new" ? "being checked" : x.status)}${x.reason ? `<br><span class="hint">${esc(x.reason)}</span>` : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="hint">Nothing submitted yet. Paste your prompt into your AI to start.</p>`}`;
    wire(d, b);
  } catch (e) { $("ask").hidden = false; $("err").textContent = key ? e.message : ""; }
}
async function settings(body) {
  const r = await fetch(`${API}/d/settings`, { method: "POST", headers: { "Content-Type": "application/json", "x-donor-key": key }, body: JSON.stringify(body) });
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "Couldn't save."); return d;
}
const CONNECTOR = "https://api.townlapse.org/mcp/tl";
function setupFor(ai, key, b) {
  const start = `Use the Townlapse connector to help research local history: call get_tasks with count 3, research all three on the web, then report everything in ONE finish_tasks call (only places you can source with a page you opened, never guess, plus a short note per assignment) and set next_count to 3 to get the next batch in the same reply. Repeat until my_budget shows nothing left for today, then tell me what you found. If you hit a tool-call limit, stop and tell me; I'll say continue.`;
  if (ai === "muse") return `<ol><li>Paste into Muse:<pre>Create a custom connector named "Townlapse" for a remote MCP server. URL: ${CONNECTOR} (streamable HTTP). Authentication: an API key sent in the request header x-townlapse-key.</pre></li>
    <li>Click <b>Connect</b> and paste this key into Muse's secure box (not the chat):<div class="key">${esc(key)}</div>If asked, <b>Always allow</b> api.townlapse.org.</li><li>Then paste:<pre>${esc(start)}</pre></li></ol>`;
  const where = ai === "chatgpt" ? "ChatGPT: Settings → Apps &amp; Connectors (Developer mode) → Create" : ai === "claude" ? "Claude: Settings → Connectors → Add custom connector" : "its custom connector (MCP) settings";
  return `<ol><li>Add a connector in ${where}: name <b>Townlapse</b>, address <div class="key">https://api.townlapse.org/mcp</div>Set Authentication to <b>OAuth</b> (not “No authentication”) and leave Client ID and secret empty. On the Townlapse page that opens, choose <b>this AI</b> and click Connect.</li>
    <li>Turn it on in a new chat and paste:<pre>${esc(start)}</pre></li></ol>
    <details><summary class="hint">If the app won't sign in</summary><p class="hint">Use <b>No authentication</b> and this private URL instead (it contains the key):</p><div class="key">${esc(CONNECTOR + "/" + key)}</div></details>
    <p class="hint">Prefer noBGP (Claude, ChatGPT, Grok)? Use the noBGP connector with the Townlapse donors service and this key; see <a href="/donate/">the donate page</a> for the steps.</p>`;
}
let currentTab = null;
const keyStore = () => { try { return JSON.parse(localStorage.getItem("townlapse_ai_keys") || "{}"); } catch { return {}; } };
const saveKey = (id, k) => { try { const m = keyStore(); m[id] = k; localStorage.setItem("townlapse_ai_keys", JSON.stringify(m)); } catch {} };
async function family(body) {
  const r = await fetch(`${API}/d/family`, { method: "POST", headers: { "Content-Type": "application/json", "x-donor-key": key }, body: JSON.stringify(body) });
  const x = await r.json(); if (!r.ok) throw new Error(x.error || "Couldn't do that."); return x;
}
function renderAis(d, b) {
  const ais = d.ais || [], mine = ais.find(a => a.this_key);
  if (mine) saveKey(mine.id, key);
  if (!currentTab || (currentTab !== "add" && !ais.find(a => a.id === currentTab))) currentTab = (mine || ais[0] || {}).id || "add";
  const counts = {}; ais.forEach(a => counts[a.ai] = (counts[a.ai] || 0) + 1);
  const seen = {};
  $("aiTabs").innerHTML = ais.map(a => { seen[a.ai] = (seen[a.ai] || 0) + 1; const label = counts[a.ai] > 1 ? `${a.ai} ${seen[a.ai]}` : a.ai;
      return `<button role="tab" class="tab${a.id === currentTab ? " on" : ""}" aria-selected="${a.id === currentTab}" data-tab="${a.id}">${esc(label)}<span class="dot ${a.connected ? "ok" : ""}" aria-label="${a.connected ? "connected" : "not connected"}"></span></button>`; }).join("")
    + `<button role="tab" class="tab add${currentTab === "add" ? " on" : ""}" aria-selected="${currentTab === "add"}" data-tab="add">+ Add another AI</button>`;
  $("aiTabs").querySelectorAll("[data-tab]").forEach(t => t.onclick = () => { currentTab = t.dataset.tab; renderAis(d, b); });
  const pane = $("aiPane");
  if (currentTab === "add") {
    pane.innerHTML = `<p class="hint">Each AI gets its own key and budget, under your one donor name. Your contributions are counted together.</p>
      <div class="row"><select id="newAi" class="f" style="max-width:220px"><option value="muse">Muse</option><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="grok">Grok</option><option value="other">Another AI</option></select><button id="addAi">Add this AI</button></div><div id="newAiMsg"></div>`;
    $("addAi").onclick = async () => {
      $("addAi").disabled = true;
      try { const r = await fetch(`${API}/d/add-ai`, { method: "POST", headers: { "Content-Type": "application/json", "x-donor-key": key }, body: JSON.stringify({ ai: $("newAi").value }) });
        const x = await r.json(); if (!r.ok) throw new Error(x.error || "Couldn't add it.");
        saveKey(x.donor_id, x.key); currentTab = x.donor_id; load(); }
      catch (e) { $("newAiMsg").innerHTML = `<p class="hint err">${esc(e.message)}</p>`; $("addAi").disabled = false; }
    };
    return;
  }
  const a = ais.find(x => x.id === currentTab); const k = keyStore()[a.id];
  pane.innerHTML = `<p style="margin:4px 0 10px"><b>${esc(a.ai)}</b>${a.main ? ' <span class="hint">(main)</span>' : ""}<span class="hint"> · ${a.connected ? "connected" : "not connected yet"} · ${a.assignments_completed} done · ${a.remaining_today} of ${a.budget_today} left today</span></p>
    ${k ? `<details ${a.connected ? "" : "open"}><summary>Setup steps for this AI</summary><p class="hint" style="margin:8px 0 0">Its key (keep it private):</p><div class="key">${esc(k)}</div>${setupFor(a.ai_code, k, b)}</details>`
        : `<p class="hint">This browser doesn't have this AI's key. Get a new one to see its setup steps (the old key stops working).</p>`}
    <div class="row" style="margin-top:10px">${k ? "" : `<button id="rekey">Get a new key</button>`}${a.main || a.this_key ? "" : `<button class="ghost" id="removeAi">Remove this AI</button>`}<span class="hint" id="aiMsg"></span></div>`;
  const rk = $("rekey"); if (rk) rk.onclick = async () => { try { const x = await family({ id: a.id, action: "rekey" }); saveKey(a.id, x.key); renderAis(d, b); } catch (e) { $("aiMsg").textContent = e.message; } };
  const rm = $("removeAi"); if (rm) rm.onclick = async () => { if (!confirm(`Remove this ${a.ai}? Its key stops working; its past work still counts.`)) return;
    try { await family({ id: a.id, action: "remove" }); currentTab = null; load(); } catch (e) { $("aiMsg").textContent = e.message; } };
}
function wire(d, b) {
  renderAis(d, b);
  document.querySelectorAll("[data-add]").forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    try { const r = await settings({ add_today: +btn.dataset.add }); $("addMsg").textContent = `Done: ${r.budget.remaining_today} left today.`; $("addMsg").className = "hint ok"; setTimeout(load, 1500); }
    catch (e) { $("addMsg").textContent = e.message; $("addMsg").className = "hint err"; }
    btn.disabled = false; });
  const sc = $("cScope"), tw = $("cTown");
  if (tw) fetch("/towns.json").then(r => r.json()).then(reg => { tw.innerHTML = (reg.towns || []).map(t => `<option value="${esc(t.slug)}"${t.slug === b.town ? " selected" : ""}>${esc(t.name)}</option>`).join(""); });
  if (sc) sc.onchange = () => { tw.hidden = sc.value !== "town"; };
  $("cSave").onclick = async () => {
    const body = { budget_per_day: +$("cBudget").value, mode: $("cMode").value };
    if (sc) { body.scope = sc.value; body.town = sc.value === "town" ? tw.value : ""; }
    try { await settings(body); $("cMsg").textContent = "Saved."; $("cMsg").className = "hint ok"; setTimeout(load, 1200); }
    catch (e) { $("cMsg").textContent = e.message; $("cMsg").className = "hint err"; }
  };
}
$("load").onclick = () => { key = $("key").value.trim(); load(); };
if (key) load(); else $("ask").hidden = false;
</script>
<script src="/feedback.js" defer></script>
</body>
</html>
