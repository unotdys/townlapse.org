<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My donations · Townlapse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%231C2629%22/><rect x=%2218%22 y=%2260%22 width=%2214%22 height=%2222%22 fill=%22%23EBC55A%22/><rect x=%2243%22 y=%2240%22 width=%2214%22 height=%2242%22 fill=%22%23E58C8C%22/><rect x=%2268%22 y=%2224%22 width=%2214%22 height=%2258%22 fill=%22%239DB8E0%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#F3EEE3;--dim:#B9B3A6;--bg:#1C2629;--panel:#243135;--line:#3A4A4F;--yellow:#EBC55A;--pink:#E58C8C;--green:#8FD1A8;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 17px/1.55 var(--body);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit;text-underline-offset:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 22px 80px}
header{padding:40px 0 10px;display:flex;justify-content:space-between}
.home{font:800 22px var(--display);text-decoration:none}
h1{font:800 clamp(40px,7vw,64px)/.92 var(--display);margin:22px 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 24px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stats b{display:block;font:800 40px/1 var(--display);color:var(--yellow)}
.stats span{color:var(--dim);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600}
.s-accepted{color:var(--green)} .s-rejected{color:var(--pink)} .s-new{color:var(--yellow)}
input{width:100%;font:15px ui-monospace,monospace;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
button{font:600 15px var(--body);color:var(--bg);background:var(--yellow);border:0;border-radius:999px;padding:11px 18px;cursor:pointer;margin-top:10px}
.hint{font-size:14px;color:var(--dim)} .err{color:var(--pink)}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="home" href="/">Townlapse</a><a class="hint" href="/donate/">Set up a donation</a></header>
  <h1 id="title">My donations</h1>
  <div id="ask" hidden>
    <p>Enter your donor key (it starts with <code>tld_</code>):</p>
    <input id="key" autocomplete="off" aria-label="Donor key"><button id="load">Show my donations</button> <span class="hint err" id="err"></span>
  </div>
  <div id="out"></div>
</div>
<script>
const API = "https://api.townlapse.org/api/tl";
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let key = ""; try { key = localStorage.getItem("townlapse_donor_key") || ""; } catch {}
async function load() {
  $("err").textContent = "";
  try {
    const r = await fetch(`${API}/d/me`, { headers: { "x-donor-key": key } }); const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Couldn't load.");
    try { localStorage.setItem("townlapse_donor_key", key); } catch {}
    $("ask").hidden = true;
    const b = d.budget, st = d.by_status || {};
    $("title").textContent = `Thank you, ${d.donor}`;
    $("out").innerHTML = `<p class="hint">${esc(d.ai)} · ${d.mode === "subscription" ? "on a schedule" : "once, when you ask"} · ${b.budget_per_day} a day${b.window ? `, ${esc(b.window)}` : ""} · ${b.scope === "town" ? "town: " + esc(b.town) : b.scope === "any" ? "any town" : "where it's needed most"}</p>
      <div class="stats"><div><b>${b.remaining_today}</b><span>left today (of ${b.budget_per_day})</span></div>
        <div><b>${d.assignments_completed}</b><span>assignments done</span></div>
        <div><b>${d.submissions}</b><span>places submitted</span></div>
        <div><b>${st.accepted || 0}</b><span>accepted on the map</span></div></div>
      <h2 style="font:800 26px var(--display)">Recent submissions</h2>
      ${(d.recent || []).length ? `<table><thead><tr><th>Place</th><th>Town</th><th>Verdict</th></tr></thead><tbody>${d.recent.slice().reverse().map(x => `<tr><td><b>${esc(x.name)}</b><br><span class="hint">${esc(x.address)}</span></td><td>${esc(x.town || "")}</td><td class="s-${esc(x.status)}">${esc(x.status === "new" ? "being checked" : x.status)}${x.reason ? `<br><span class="hint">${esc(x.reason)}</span>` : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="hint">Nothing submitted yet. Paste your prompt into your AI to start.</p>`}`;
  } catch (e) { $("ask").hidden = false; $("err").textContent = key ? e.message : ""; }
}
$("load").onclick = () => { key = $("key").value.trim(); load(); };
if (key) load(); else $("ask").hidden = false;
</script>
</body>
</html>
